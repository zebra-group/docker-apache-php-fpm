# =============================================================================
# Apache main configuration — replaces Debian's apache2.conf entirely.
#
# There is no default config underneath this file: anything not set here is an
# Apache built-in default, not a Debian one. Check what the distro package
# normally ships before removing a directive.
#
# ${VARIABLES} are read from the process environment. The entrypoint exports a
# default for every one of them, so they are always defined — see
# docker/entrypoint.sh and docs/DEPLOYMENT.md.
# =============================================================================

ServerName   ${APACHE_SERVER_NAME}
Listen       ${APACHE_PORT}
User         www-data
Group        www-data

Mutex             default
DefaultRuntimeDir /var/run/apache2
PidFile           /var/run/apache2/apache2.pid

# Only the module .load/.conf files come from the distro.
IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf

# Debian's conf-available/security.conf is disabled in the Dockerfile (a2disconf
# security), because it is included from conf-enabled/ at the *end* of this file
# and its `ServerTokens OS` would override whatever we set here — leaking the
# exact Apache and Debian version in every response. Its three directives are
# set here instead, and the dotfile denial it suggests is implemented below.
ServerTokens    Prod
ServerSignature Off
TraceEnable     Off

# =============================================================================
# Connection handling
# =============================================================================
Timeout              ${APACHE_TIMEOUT}
KeepAlive            ${APACHE_KEEPALIVE}
MaxKeepAliveRequests ${APACHE_MAX_KEEPALIVE_REQUESTS}
KeepAliveTimeout     ${APACHE_KEEPALIVE_TIMEOUT}
HostnameLookups      Off

# Turn both off for network/fuse-backed volumes (NFS, some CI runners), where
# the kernel can serve stale or truncated static files.
EnableSendfile ${APACHE_ENABLE_SENDFILE}
EnableMMAP     ${APACHE_ENABLE_MMAP}

# =============================================================================
# MPM event sizing
#
# ServerLimit is derived from MaxRequestWorkers / ThreadsPerChild by the
# entrypoint — setting MaxRequestWorkers above ServerLimit * ThreadsPerChild
# silently caps it and logs a startup warning.
#
# These threads terminate connections and serve static files. They are NOT the
# PHP concurrency limit — that is PHP_FPM_MAX_CHILDREN. Apache intentionally
# has more workers than FPM so static assets and keep-alive connections are
# never blocked behind PHP; requests beyond FPM capacity queue on the socket
# (see listen.backlog in www.conf).
# =============================================================================
<IfModule mpm_event_module>
    ServerLimit              ${APACHE_SERVER_LIMIT}
    StartServers             ${APACHE_START_SERVERS}
    ThreadLimit              ${APACHE_THREADS_PER_CHILD}
    ThreadsPerChild          ${APACHE_THREADS_PER_CHILD}
    MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
    MinSpareThreads          ${APACHE_MIN_SPARE_THREADS}
    MaxSpareThreads          ${APACHE_MAX_SPARE_THREADS}
    # 0 = never recycle. Recycling children only helps leaky in-process modules;
    # PHP runs out-of-process here, so the old value of 5000 just cost restarts.
    MaxConnectionsPerChild   ${APACHE_MAX_CONNECTIONS_PER_CHILD}
    AsyncRequestWorkerFactor ${APACHE_ASYNC_REQUEST_WORKER_FACTOR}
</IfModule>

# =============================================================================
# Logging — stdout/stderr only, so `docker logs` is the single source of truth.
#
# %a is the real client address once mod_remoteip is active (see runtime.d),
# otherwise the connecting peer. %D is the request duration in microseconds,
# which is what you need to find slow routes under load.
# =============================================================================
ErrorLog /proc/self/fd/2
LogLevel ${APACHE_LOG_LEVEL}

LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %Dus" combined_time
LogFormat "%a %l %u %t \"%r\" %>s %O" common

# Container orchestrators poll the health endpoints every few seconds; logging
# those drowns out real traffic.
SetEnvIf Request_URI "^/(healthz|fpm-ping|fpm-status|server-status)$" apache_dontlog
CustomLog /proc/self/fd/1 ${APACHE_LOG_FORMAT} env=!apache_dontlog

# =============================================================================
# Document root and access control
# =============================================================================
DocumentRoot   /var/www/html
DirectoryIndex index.php index.html

<Directory />
    Options FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    # TYPO3, WordPress and Grav all ship .htaccess rewrite rules. Set
    # APACHE_ALLOW_OVERRIDE=None once those rules are baked into conf.d/ —
    # it removes a stat() per directory level on every single request.
    AllowOverride ${APACHE_ALLOW_OVERRIDE}
    Require all granted
</Directory>

# .ht*, VCS metadata, dotfiles and Composer/lock internals must never be served.
<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>
<FilesMatch "^(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|\.env.*)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(git|svn|hg|idea|vscode)(/|$)">
    Require all denied
</DirectoryMatch>

# =============================================================================
# PHP-FPM
#
# security.limit_extensions in www.conf is what actually prevents non-.php
# files from being executed; this block only decides what gets proxied.
# =============================================================================
<FilesMatch "\.php$">
    SetHandler "proxy:unix:${PHP_FPM_SOCKET}|fcgi://php-fpm"
</FilesMatch>

<Proxy "fcgi://php-fpm">
    # Must be >= PHP's max_execution_time, otherwise Apache abandons the request
    # with a 503 while the FPM worker keeps running. The entrypoint derives this
    # from PHP_MAX_EXECUTION_TIME so the two cannot drift apart.
    ProxySet timeout=${APACHE_PROXY_TIMEOUT}
</Proxy>
ProxyTimeout ${APACHE_PROXY_TIMEOUT}

# Never let the FPM status/ping endpoints or Apache's own status be reachable
# from outside the container.
<LocationMatch "^/(fpm-status|fpm-ping)$">
    Require local
    SetHandler "proxy:unix:${PHP_FPM_SOCKET}|fcgi://php-fpm"
</LocationMatch>

<Location "/server-status">
    Require local
    SetHandler server-status
</Location>

# Liveness endpoint served straight from disk without touching PHP, for load
# balancers that should not pay for a PHP request per probe. Deliberately
# outside DocumentRoot so a bind-mounted /var/www/html cannot shadow it.
# The container's own HEALTHCHECK uses /fpm-ping instead, because that also
# proves PHP-FPM is answering.
Alias /healthz /usr/local/share/apache2-healthz/ok.txt
<Directory "/usr/local/share/apache2-healthz">
    Options None
    AllowOverride None
    Require all granted
</Directory>

# =============================================================================
# Compression
#
# brotli and deflate are selected in mutually exclusive branches. Registering
# both filters for the same content types would chain them and emit
# "Content-Encoding: br, gzip", which no client can decode.
# =============================================================================
# The type list is written out literally rather than pulled from a variable:
# Apache expands ${VAR} while reading the line, and a value containing spaces
# does not reliably split into separate directive arguments. Compressible types
# are also not something that needs to vary per deployment.
#
# Deliberately absent: images and fonts (already compressed — recompressing
# costs CPU and usually grows them).
<If "%{req:Accept-Encoding} =~ /br/ && -T '${APACHE_BROTLI}'">
    AddOutputFilterByType BROTLI_COMPRESS \
        text/html text/plain text/css text/xml text/javascript \
        application/javascript application/json application/xml \
        application/rss+xml application/atom+xml application/ld+json \
        application/manifest+json application/wasm image/svg+xml
</If>
<Else>
    AddOutputFilterByType DEFLATE \
        text/html text/plain text/css text/xml text/javascript \
        application/javascript application/json application/xml \
        application/rss+xml application/atom+xml application/ld+json \
        application/manifest+json application/wasm image/svg+xml
</Else>

<IfModule mod_brotli.c>
    BrotliCompressionQuality ${APACHE_BROTLI_QUALITY}
</IfModule>

<IfModule mod_deflate.c>
    DeflateCompressionLevel ${APACHE_DEFLATE_LEVEL}
</IfModule>

# =============================================================================
# Caching
#
# THE IMPORTANT PART: long-lived caching is scoped to static assets by
# extension. This used to be a bare `Header set Cache-Control "max-age=31536000,
# public"` in server context, which applied to *every* response — including
# TYPO3 backend pages, wp-admin, login redirects and form output. Browsers and
# any shared proxy in front cached authenticated HTML for a year.
# =============================================================================
# By file extension, so PHP output never matches. mod_expires stays loaded
# (application .htaccess files use it) but is deliberately not configured here:
# ExpiresByType keys on the MIME type, so it also hit PHP output — an image or
# CSS generated by PHP got a shared-cacheable 30-day max-age, overriding the
# private default below.
#
# Deliberately no `immutable`: TYPO3 and WordPress
# version assets via query string (?v=, ?ver=), and immutable tells the browser
# never to revalidate, which strands clients on stale files after a deploy.
<FilesMatch "\.(?i:css|js|mjs|jpe?g|png|gif|webp|avif|svg|svgz|ico|woff|woff2|ttf|otf|eot|mp4|webm|ogv|mp3|ogg|wav|flac)$">
    Header set Cache-Control "public, max-age=${APACHE_ASSET_CACHE_MAX_AGE}"
</FilesMatch>

# Dynamic output defaults to uncacheable. setifempty means the application stays
# in control: if TYPO3 or WordPress sends its own Cache-Control for a publicly
# cacheable page, that value is kept.
<FilesMatch "\.php$">
    Header setifempty Cache-Control "private, no-cache, must-revalidate"
</FilesMatch>
<Location "/">
    Header setifempty Cache-Control "private, no-cache, must-revalidate"
</Location>

# =============================================================================
# Security headers — setifempty throughout, so an application that sets its own
# policy is never overridden.
# =============================================================================
<IfModule mod_headers.c>
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"
    # SAMEORIGIN rather than DENY: the TYPO3 backend frames its own modules.
    Header setifempty X-Frame-Options "SAMEORIGIN"
    # PHP's expose_php is already Off; this catches anything set by the app.
    Header unset X-Powered-By
</IfModule>

# =============================================================================
# Includes — later wins, so downstream images and mounted config can override
# anything above.
#
#   runtime.d/     generated from environment variables by the entrypoint
#   conf-enabled/  distro + a2enconf
#   conf.d/        free for downstream images and bind mounts
# =============================================================================
IncludeOptional runtime.d/*.conf
IncludeOptional conf-enabled/*.conf
IncludeOptional conf.d/*.conf
